{% extends "base.html" %}

{% block title %}Page Not Found (404) – SkillSync{% endblock %}

{% block content %}
<div class="container" style="max-width: 680px; margin: 5rem auto; text-align: center; padding: 2rem;">
  <div style="font-size: 4rem; font-weight: 800; color: var(--primary); line-height: 1; margin-bottom: 1rem;">
    404
  </div>
  <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 1rem; color: var(--text);">
    Page Not Found
  </h1>
  <p style="color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem;">
    The page or project you requested could not be located.
  </p>
  <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
    <a href="{{ url_for('projects.list_projects') }}" class="btn btn-secondary">
      Explore Projects
    </a>
    <a href="{{ url_for('projects.landing') }}" class="btn btn-primary">
      Return to Home
    </a>
  </div>
</div>
{% endblock %}
